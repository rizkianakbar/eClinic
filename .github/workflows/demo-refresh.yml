# Keeps the public demo clinic (demo.<root domain>) looking like a working day: closes earlier days' unfinished
# demo visits and creates today's queue at every station (scripts/seed-test-data.ts; demo clinic test data only).
#
# Repository secrets (Settings → Secrets and variables → Actions), the same values as .env.local:
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
#   SUPABASE_SECRET_KEY
name: Daily demo refresh

on:
  schedule:
    - cron: "0 23 * * *" # 06:00 WIB, before clinic hours
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Seed today's demo day
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: bun scripts/seed-test-data.ts
